version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aimath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aimath
      POSTGRES_USER: aimath
      POSTGRES_PASSWORD: aimath_dev_password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimath -d aimath"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aimath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aimath-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://aimath:aimath_dev_password@postgres:5432/aimath
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
